name: Deploy Backend

on:
  push:
    branches:
      - master-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/personal-wallet-backend
            git config --global --add safe.directory /var/www/personal-wallet-backend
            git pull
            php artisan config:clear
            php artisan cache:clear